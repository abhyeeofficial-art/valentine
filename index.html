<script>
const noBtn = document.getElementById("no");

function moveNoButton() {
  const x = Math.random() * 220 - 110;
  const y = Math.random() * 220 - 110;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

// Move when finger/mouse comes close
noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

// ALSO keep moving every 700ms (mobile friendly)
setInterval(moveNoButton, 700);

function yesClicked() {
  document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#ff4d6d;">
      <h1 style="color:white;font-size:36px;">Yay 💕 I knew it!</h1>
    </div>
  `;
}
</script>
